<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabNexus · 课题组平台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== 登录 / 注册 ===== -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <h1>LabNexus</h1>
    <p class="login-sub">课题组自己的科研朋友圈 · 知识库 · 进度监督</p>
    <div class="tabs">
      <button id="tab-login" class="tab active" onclick="Auth.switchTab('login')">登录</button>
      <button id="tab-register" class="tab" onclick="Auth.switchTab('register')">注册</button>
    </div>
    <form id="login-form" onsubmit="Auth.login(event)">
      <input name="username" placeholder="用户名" required>
      <input name="password" type="password" placeholder="密码" required>
      <button type="submit" class="btn primary">登 录</button>
    </form>
    <form id="register-form" class="hidden" onsubmit="Auth.register(event)">
      <input name="invite_code" placeholder="邀请码" required>
      <input name="username" placeholder="用户名" required>
      <input name="display_name" placeholder="昵称" required>
      <input name="password" type="password" placeholder="密码(≥8位)" required minlength="8">
      <button type="submit" class="btn primary">注册并登录</button>
    </form>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">LabNexus</div>
    <div class="search-box">
      <input id="search-input" placeholder="搜索文档 / 资源 / 任务…" onkeydown="if(event.key==='Enter')Search.run()">
    </div>
    <div class="user-box">
      <span id="current-user"></span>
      <button class="btn ghost" onclick="Auth.logout()">登出</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar">
      <button class="nav-item" data-view="feed" onclick="App.nav('feed')">🏠 信息流</button>
      <button class="nav-item" data-view="space" onclick="App.nav('space')">📁 我的空间</button>
      <button class="nav-item" data-view="resources" onclick="App.nav('resources')">📚 资源库</button>
      <button class="nav-item" data-view="projects" onclick="App.nav('projects')">📋 项目</button>
      <button class="nav-item" data-view="tags" onclick="App.nav('tags')">🏷 标签</button>
      <button class="nav-item finance-only hidden" data-view="finance" onclick="App.nav('finance')">💰 经费</button>
    </nav>
    <main id="main" class="main">
      <!-- 视图动态渲染 -->
    </main>
  </div>
</div>

<!-- 文档编辑器弹层 -->
<div id="editor-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="editor-title">新建文档</h3>
    <input id="doc-title" placeholder="标题" class="doc-input">
    <textarea id="doc-content" placeholder="正文(Markdown)…" rows="10"></textarea>
    <div class="editor-row">
      <select id="doc-visibility">
        <option value="private">私有(仅自己)</option>
        <option value="public">公开(发布到信息流)</option>
      </select>
      <input type="hidden" id="doc-folder">
      <input type="hidden" id="doc-id">
    </div>
    <div class="tag-picker-wrap">
      <label class="tag-picker-label">标签</label>
      <div id="doc-tag-picker" class="tag-picker"></div>
    </div>
    <div class="editor-actions">
      <button class="btn ghost" onclick="Editor.close()">取消</button>
      <button class="btn primary" onclick="Editor.save()">保存</button>
    </div>
    <div id="editor-msg" class="msg"></div>
  </div>
</div>

<!-- 资源编辑器弹层 -->
<div id="resource-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="res-editor-title">新建链接</h3>
    <div class="editor-row">
      <select id="res-type">
        <option value="link">链接</option>
        <option value="file">文件</option>
      </select>
    </div>
    <input id="res-title" placeholder="标题" class="doc-input">
    <input id="res-url" placeholder="URL(仅 http/https)" class="doc-input">
    <input id="res-description" placeholder="描述/备注(可选)" class="doc-input">
    <input id="res-file" type="file" class="doc-input" style="display:none">
    <div class="tag-picker-wrap">
      <label class="tag-picker-label">标签</label>
      <div id="res-tag-picker" class="tag-picker"></div>
    </div>
    <div class="editor-actions">
      <button class="btn ghost" onclick="Resources.closeCreate()">取消</button>
      <button class="btn primary" onclick="Resources.saveCreate()">保存</button>
    </div>
    <div id="res-msg" class="msg"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
